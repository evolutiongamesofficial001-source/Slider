<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Slider ia</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='black'/><text x='50' y='70' font-size='62' text-anchor='middle' fill='%2300ff88' font-family='Arial' font-weight='800'>S</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Montserrat:wght@400;700&family=Playfair+Display:wght@400;700&family=Space+Grotesk:wght@400;700&family=Orbitron:wght@400;700&family=Inter:wght@400;700&family=Merriweather:wght@400;700&family=Raleway:wght@400;700&family=Oswald:wght@400;700&family=Lora:wght@400;700&family=DM+Sans:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--g1:#00ff88;--g2:#00b36b;--g3:#064d2c}
html,body{min-height:100%}
body{font-family:'Poppins',sans-serif;color:#e8fff3;background:radial-gradient(1200px 600px at 80% -10%,#0a3d24 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#06301c 0%,transparent 60%),#020604;min-height:100vh}
body.lock{overflow:hidden;position:fixed;width:100%;height:100%}
.grad{background:linear-gradient(90deg,var(--g1),var(--g2),#00ffd0);-webkit-background-clip:text;background-clip:text;color:transparent}
header{padding:18px 24px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--g1),var(--g3));display:grid;place-items:center;font-weight:800;color:#000;font-size:22px;box-shadow:0 0 24px #00ff8855}
header h1{font-size:26px;font-weight:800;letter-spacing:.5px}
.wrap{max-width:820px;margin:0 auto;padding:16px 20px 60px}
.card{background:linear-gradient(160deg,#07140d,#030907);border:1px solid #0f5a35;border-radius:20px;padding:22px;box-shadow:0 0 40px #00ff8814}
.hero{text-align:center;margin:20px 0 26px}
.hero h2{font-size:clamp(28px,6vw,46px);font-weight:800;line-height:1.1}
.hero p{opacity:.7;margin-top:10px}
textarea{width:100%;min-height:130px;background:#020604;border:1px solid #0f5a35;border-radius:14px;color:#e8fff3;padding:14px;font:inherit;font-size:16px;resize:vertical;outline:none}
textarea:focus{border-color:var(--g1);box-shadow:0 0 0 3px #00ff8822}
.models{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.mdl{border:1px solid #0f5a35;border-radius:14px;padding:14px;cursor:pointer;transition:.2s;background:#030a06;position:relative}
.mdl b{display:block;font-size:15px}.mdl small{opacity:.65;font-size:12px}
.mdl.on{border-color:var(--g1);background:linear-gradient(135deg,#06301c,#030a06);box-shadow:0 0 22px #00ff8833}
.tag{position:absolute;top:8px;right:8px;font-size:10px;font-weight:700;color:#001a0d;background:linear-gradient(90deg,var(--g1),var(--g2));padding:2px 8px;border-radius:20px}
button{font:inherit;cursor:pointer;border:0}
.btn{width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:16px;color:#001a0d;background:linear-gradient(90deg,var(--g1),var(--g2));transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 30px #00ff8844}
.btn:disabled{opacity:.5;cursor:wait}
#st{text-align:center;margin-top:14px;min-height:22px;color:var(--g1);font-size:14px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #00ff8844;border-top-color:var(--g1);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
#viewer{display:none;min-height:100vh;min-height:100dvh;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px;background:#000}
#viewer.on{display:flex}
.box{position:relative;width:min(100%,calc((100vh - 110px)*16/9));width:min(100%,calc((100dvh - 110px)*16/9));aspect-ratio:16/9}
.stage{container-type:size;position:absolute;inset:0;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--tx);font-family:var(--fb);box-shadow:0 0 60px #00ff8822;border:1px solid #0f5a35}
.slide{position:absolute;inset:0;animation:fd .5s ease;display:flex;flex-direction:column;justify-content:center;padding:6cqw 7cqw;gap:2.4cqw}
@keyframes fd{from{opacity:0;transform:scale(1.02)}to{opacity:1}}
.bgimg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.ov{position:absolute;inset:0;z-index:0;background:linear-gradient(120deg,var(--bg1) 5%,transparent 140%);opacity:.86}
.slide>*:not(.bgimg):not(.ov){position:relative;z-index:1}
.slide h1{font-family:var(--fh);font-size:6.4cqw;line-height:1.05}
.slide h2{font-family:var(--fh);font-size:4.2cqw;line-height:1.1}
.slide h1 span,.slide h2 span{background:linear-gradient(90deg,var(--ac),var(--tx));-webkit-background-clip:text;background-clip:text;color:transparent}
.slide .sub{font-size:2.3cqw;opacity:.85;max-width:75%}
.slide ul{list-style:none;display:flex;flex-direction:column;gap:1.5cqw}
.slide li{font-size:2.3cqw;line-height:1.35;padding-left:2.6cqw;position:relative}
.slide li:before{content:"";position:absolute;left:0;top:.65em;width:1.2cqw;height:1.2cqw;border-radius:50%;background:var(--ac);box-shadow:0 0 1.2cqw var(--ac)}
.split{flex-direction:row;align-items:center;gap:4cqw}
.split .tx{flex:1.1;display:flex;flex-direction:column;gap:2cqw}
.split .im{flex:1;height:78%;border-radius:2cqw;background-size:cover;background-position:center;border:.3cqw solid var(--ac);box-shadow:0 0 3cqw color-mix(in srgb,var(--ac) 40%,transparent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(20cqw,1fr));gap:2cqw;margin-top:1cqw}
.cd{background:color-mix(in srgb,var(--bg1) 70%,transparent);border:.2cqw solid var(--ac);border-radius:1.8cqw;padding:2cqw;font-size:2cqw;line-height:1.35;backdrop-filter:blur(6px)}
.cd b{display:block;color:var(--ac);font-family:var(--fh);font-size:2.4cqw;margin-bottom:.8cqw}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.bar button{background:#07140d;color:#e8fff3;border:1px solid #0f5a35;padding:10px 16px;border-radius:12px;font-size:14px}
.bar button:hover{border-color:var(--g1)}
.bar .pri{background:linear-gradient(90deg,var(--g1),var(--g2));color:#001a0d;font-weight:700;border:0}
#cnt{min-width:64px;text-align:center;color:var(--g1);font-weight:600}
.nav{display:none;position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;z-index:5;background:#000a;color:var(--g1);font-size:22px;border:1px solid var(--g1);align-items:center;justify-content:center}
#pv{left:8px}#nx{right:8px}
@media(pointer:coarse),(max-width:700px){.nav{display:flex}}

/* TELA CHEIA (nativa + modo "pseudo" para iPhone/celulares sem API) */
#xf{display:none;position:absolute;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));z-index:60;width:42px;height:42px;border-radius:50%;background:#000b;color:var(--g1);border:1px solid var(--g1);font-size:20px;align-items:center;justify-content:center;transition:opacity .4s}
#viewer.pfs{position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;height:100vh;height:100dvh;z-index:100;padding:0;gap:0;background:#000;min-height:0}
#viewer.pfs .box{width:min(100vw,calc(100dvh*16/9));max-height:100dvh}
#viewer.pfs .stage{border-radius:0;border:0;box-shadow:none}
#viewer.pfs .bar{display:none}
#viewer.pfs #xf{display:flex}
#viewer.pfs.idle #xf{opacity:0;pointer-events:none}
#viewer.pfs.idle .nav{opacity:.25}
#viewer.pfs:fullscreen,#viewer.pfs:-webkit-full-screen{width:100vw;height:100vh}

#modal{position:fixed;inset:0;background:#000c;display:none;place-items:center;z-index:200;padding:20px}
#modal.on{display:grid}
#modal .card{width:min(520px,100%)}
#modal input{width:100%;padding:12px;margin:12px 0;background:#020604;border:1px solid #0f5a35;color:var(--g1);border-radius:10px;font:inherit;font-size:13px}
@media(max-width:600px){.models{grid-template-columns:1fr}.slide li{font-size:2.6cqw}}
</style>
</head>
<body>
<div id="home">
<header><div class="logo">S</div><h1 class="grad">Slider</h1></header>
<div class="wrap">
<div class="hero"><h2>Slides com <span class="grad">IA</span> em segundos</h2><p>Wikipedia + banco de imagens + design automático</p></div>
<div class="card">
<textarea id="prompt" placeholder="Ex: A história da exploração espacial e o futuro de Marte"></textarea>
<div class="models">
<div class="mdl on" data-m="brain"><span class="tag">PRO</span><b>S.A.R BRAIN 4 pro</b><small>Raciocínio avançado e profundo</small></div>
<div class="mdl" data-m="opus"><b>S.A.R OPUS 3</b><small>Versátil e rápido</small></div>
</div>
<button class="btn" id="go">Gerar apresentação</button>
<div id="st"></div>
</div>
</div>
</div>

<div id="viewer">
<div class="box">
<div class="stage" id="stage"></div>
<button class="nav" id="pv">‹</button><button class="nav" id="nx">›</button>
</div>
<button id="xf" aria-label="Sair da tela cheia">✕</button>
<div class="bar">
<button id="bp">◀</button><span id="cnt"></span><button id="bn">▶</button>
<button id="fs">⛶ Tela cheia</button>
<button id="sh" class="pri">🔗 Compartilhar</button>
<button id="dl" class="pri">⬇ PowerPoint</button>
<button id="nw">+ Novo</button>
</div>
</div>

<div id="modal"><div class="card"><h3 class="grad">Link de compartilhamento</h3>
<input id="lnk" readonly>
<div class="bar"><button class="pri" id="cp">Copiar link</button><button id="cl">Fechar</button></div></div></div>

<script>
const rot=s=>s.replace(/[a-z]/gi,c=>{const b=c<='Z'?65:97;return String.fromCharCode((c.charCodeAt(0)-b+13)%26+b)});
const KEY=rot('tfx_BXYEdF7ivMdDKqJqrDNRJTqlo3SLHPRfU49veO20adTs1lWAkpu4');
const MODELS={brain:'openai/gpt-oss-120b',opus:'llama-3.3-70b-versatile'};
const FONTS=['Poppins','Montserrat','Playfair Display','Space Grotesk','Orbitron','Inter','Merriweather','Raleway','Oswald','Lora','DM Sans'];
const SYS=`Você é o motor de criação de apresentações da plataforma Slider. Sua única função é transformar um TEMA do usuário em uma apresentação profissional, bonita e coerente, devolvida EXCLUSIVAMENTE em JSON válido (sem markdown, sem comentários, sem texto fora do JSON).

REGRAS DE CONTEÚDO
1. Gere SEMPRE no mínimo 5 slides. O padrão ideal é 7 slides; use até 10 se o tema for amplo. Nunca gere menos que 5.
2. Use ao máximo o tema exato digitado pelo usuário: as palavras-chave do tema devem aparecer no título principal, nos títulos dos slides e nos textos. Não fuja do assunto.
3. Use o CONTEXTO DA WIKIPEDIA fornecido como fonte principal de fatos (datas, nomes, números, definições). Reescreva com suas palavras, de forma clara. Nunca invente números, datas ou citações. Se o contexto for insuficiente, use apenas conhecimento geral seguro e evite precisão duvidosa.
4. Responda no mesmo idioma do tema do usuário.
5. Estrutura recomendada: slide 1 capa (layout "cover"); slides do meio explicando introdução, contexto/história, conceitos principais, dados curiosos, impactos/aplicações, futuro/desafios; último slide conclusão (layout "end") com 3 a 4 pontos-chave.
6. Títulos curtos (até 8 palavras). Cada slide de conteúdo tem de 3 a 4 tópicos, cada um com no máximo 16 palavras, objetivos e informativos. Nada de parágrafos longos.
7. Para o layout "cards", cada tópico deve ter o formato "Título curto: explicação curta".
8. Escreva em "notes" uma fala curta (1 a 2 frases) para o apresentador.

LAYOUTS PERMITIDOS (alterne para criar ritmo visual, não repita o mesmo layout mais de 2 vezes seguidas)
- "cover": capa com imagem de fundo (title, subtitle).
- "bg": imagem de fundo escurecida com título e tópicos.
- "split": texto à esquerda e imagem destacada à direita.
- "cards": tópicos em cartões lado a lado.
- "end": encerramento com imagem de fundo e pontos-chave.

IMAGENS
- Para cada slide forneça "imageQuery": 2 a 4 palavras EM INGLÊS, concretas e visuais, ideais para buscar fotos reais no Wikimedia Commons (ex: "Mars surface landscape", "Apollo 11 launch"). Evite termos abstratos, nomes de pessoas vivas e conceitos sem imagem física.
- As imagens são usadas como fundo ou elemento, então prefira cenas amplas, paisagens, objetos e lugares.

DESIGN (OBRIGATÓRIO)
- Defina "theme" com cores harmônicas e de alto contraste, coerentes com o assunto: bg1 (fundo escuro principal), bg2 (fundo escuro secundário, tom próximo ao bg1), accent (cor de destaque vibrante) e text (cor do texto, clara). Todas em hexadecimal #RRGGBB. O texto deve ser sempre legível sobre o fundo.
- Escolha "fontHeading" e "fontBody" SOMENTE desta lista: ${FONTS.join(', ')}. Combine de forma elegante (ex: Playfair Display + Inter para temas históricos/culturais; Orbitron + Space Grotesk para tecnologia/espaço; Montserrat + Poppins para negócios; Oswald + DM Sans para esportes/energia; Lora + Raleway para natureza/saúde).

FORMATO DE SAÍDA (JSON estrito)
{"title":"string","theme":{"bg1":"#000000","bg2":"#000000","accent":"#00ff88","text":"#ffffff","fontHeading":"Poppins","fontBody":"Inter"},"slides":[{"layout":"cover","title":"string","subtitle":"string","bullets":[],"imageQuery":"string","notes":"string"},{"layout":"split","title":"string","subtitle":"","bullets":["string","string","string"],"imageQuery":"string","notes":"string"}]}

Retorne apenas o JSON.`;

const $=id=>document.getElementById(id);
let model='brain',deck=null,cur=0;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hex=(v,d)=>/^#[0-9a-f]{6}$/i.test(v||'')?v:d;
const st=(t,l)=>$('st').innerHTML=t?(l?'<span class="spin"></span>':'')+esc(t):'';

document.querySelectorAll('.mdl').forEach(m=>m.onclick=()=>{document.querySelectorAll('.mdl').forEach(x=>x.classList.remove('on'));m.classList.add('on');model=m.dataset.m});

async function wiki(q){
  for(const l of ['pt','en']){
    try{
      const u=`https://${l}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=4&prop=extracts&exintro=1&explaintext=1&exlimit=max&exchars=1000&format=json&origin=*`;
      const j=await (await fetch(u)).json();
      const p=Object.values(j.query?.pages||{}).sort((a,b)=>a.index-b.index);
      if(p.length)return p.map(x=>`## ${x.title}\n${x.extract||''}`).join('\n\n');
    }catch(e){}
  }
  return '';
}
async function commons(q){
  try{
    const u=`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch=${encodeURIComponent(q+' filetype:bitmap')}&gsrlimit=10&prop=imageinfo&iiprop=url|mime|size&iiurlwidth=1280&format=json&origin=*`;
    const j=await (await fetch(u)).json();
    return Object.values(j.query?.pages||{}).sort((a,b)=>a.index-b.index)
      .map(p=>p.imageinfo?.[0]).filter(i=>i&&i.mime==='image/jpeg'&&i.width>=900&&i.thumburl).map(i=>i.thumburl);
  }catch(e){return[]}
}
async function ai(p,w){
  const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',
    headers:{'Content-Type':'application/json',Authorization:'Bearer '+KEY},
    body:JSON.stringify({model:MODELS[model],temperature:.7,max_tokens:7000,response_format:{type:'json_object'},
      messages:[{role:'system',content:SYS},{role:'user',content:`TEMA: ${p}\n\nCONTEXTO DA WIKIPEDIA:\n${w||'(nada encontrado)'}`}]})});
  if(!r.ok)throw new Error('Erro na API ('+r.status+')');
  const t=(await r.json()).choices[0].message.content.replace(/```json|```/g,'').trim();
  return JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));
}
$('go').onclick=async()=>{
  const p=$('prompt').value.trim();if(!p)return st('Digite o tema da apresentação.');
  $('go').disabled=true;
  try{
    st('Buscando na Wikipedia...',1);const w=await wiki(p);
    let j;
    for(let i=0;i<2;i++){
      st(i?'Ajustando slides...':'A IA está criando seus slides...',1);
      j=await ai(p,w);if((j.slides||[]).length>=5)break;
    }
    if((j.slides||[]).length<5)throw new Error('A IA não gerou slides suficientes. Tente novamente.');
    st('Selecionando imagens...',1);
    const lists=await Promise.all(j.slides.map(s=>commons(s.imageQuery||p)));
    const used=new Set();
    const t=j.theme||{};
    deck={t:j.title||p,
      th:{b1:hex(t.bg1,'#030a06'),b2:hex(t.bg2,'#06301c'),ac:hex(t.accent,'#00ff88'),tx:hex(t.text,'#ffffff'),
          fh:FONTS.includes(t.fontHeading)?t.fontHeading:'Poppins',fb:FONTS.includes(t.fontBody)?t.fontBody:'Inter'},
      s:j.slides.map((s,i)=>{const img=lists[i].find(u=>!used.has(u))||'';if(img)used.add(img);
        return{l:['cover','bg','split','cards','end'].includes(s.layout)?s.layout:'bg',t:s.title||'',u:s.subtitle||'',b:(s.bullets||[]).slice(0,5),i:img,n:s.notes||''}})};
    st('');cur=0;show();
  }catch(e){st('Erro: '+e.message)}
  $('go').disabled=false;
};

function slideHTML(s){
  const bg=s.i?`<div class="bgimg" style="background-image:url('${esc(s.i)}')"></div><div class="ov"></div>`:'';
  const ul=s.b.length?`<ul>${s.b.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`:'';
  if(s.l==='cover')return`<div class="slide">${bg}<h1><span>${esc(s.t)}</span></h1><p class="sub">${esc(s.u)}</p></div>`;
  if(s.l==='split')return`<div class="slide split"><div class="tx"><h2><span>${esc(s.t)}</span></h2>${ul}</div><div class="im" style="${s.i?`background-image:url('${esc(s.i)}')`:'background:linear-gradient(135deg,var(--ac),var(--bg2))'}"></div></div>`;
  if(s.l==='cards')return`<div class="slide">${bg}<h2><span>${esc(s.t)}</span></h2><div class="cards">${s.b.map(b=>{const k=b.indexOf(':');return k>0&&k<40?`<div class="cd"><b>${esc(b.slice(0,k))}</b>${esc(b.slice(k+1).trim())}</div>`:`<div class="cd">${esc(b)}</div>`}).join('')}</div></div>`;
  return`<div class="slide">${bg}<h2><span>${esc(s.t)}</span></h2>${ul}</div>`;
}
function theme(el,t){const st=el.style;st.setProperty('--bg1',t.b1);st.setProperty('--bg2',t.b2);st.setProperty('--ac',t.ac);st.setProperty('--tx',t.tx);st.setProperty('--fh',`'${t.fh}',sans-serif`);st.setProperty('--fb',`'${t.fb}',sans-serif`)}
function show(){
  $('home').style.display='none';$('viewer').classList.add('on');
  theme($('stage'),deck.th);draw();
}
function draw(){
  $('stage').innerHTML=slideHTML(deck.s[cur]);
  $('cnt').textContent=(cur+1)+' / '+deck.s.length;
  document.title=deck.t+' — Slider';
}
function go(d){const n=cur+d;if(n>=0&&n<deck.s.length){cur=n;draw();wake()}}
$('bp').onclick=$('pv').onclick=()=>go(-1);
$('bn').onclick=$('nx').onclick=()=>go(1);

/* ===== TELA CHEIA: funciona em PC, Android e iPhone ===== */
const V=$('viewer');
const nativeEl=()=>document.fullscreenElement||document.webkitFullscreenElement||document.msFullscreenElement;
const isFS=()=>V.classList.contains('pfs');
let idleT;
function wake(){
  if(!isFS())return;
  V.classList.remove('idle');clearTimeout(idleT);
  idleT=setTimeout(()=>V.classList.add('idle'),2800);
}
async function enterFS(){
  V.classList.add('pfs');document.body.classList.add('lock');
  const el=document.documentElement;
  const rq=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
  if(rq){try{const r=rq.call(el,{navigationUI:'hide'});if(r&&r.then)await r}catch(e){}}
  try{await screen.orientation.lock('landscape')}catch(e){}
  window.scrollTo(0,1);
  wake();
}
async function exitFS(){
  V.classList.remove('pfs','idle');document.body.classList.remove('lock');clearTimeout(idleT);
  try{screen.orientation.unlock()}catch(e){}
  if(nativeEl()){
    const ex=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
    try{const r=ex.call(document);if(r&&r.then)await r}catch(e){}
  }
}
const toggleFS=()=>isFS()?exitFS():enterFS();
$('fs').onclick=toggleFS;
$('xf').onclick=exitFS;
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{
  if(!nativeEl()&&isFS())exitFS();
}));
V.addEventListener('touchstart',wake,{passive:true});
V.addEventListener('mousemove',wake);
V.addEventListener('click',wake);

document.addEventListener('keydown',e=>{
  if(!deck||!V.classList.contains('on'))return;
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}
  if(['ArrowLeft','PageUp'].includes(e.key))go(-1);
  if(e.key==='f'||e.key==='F')toggleFS();
  if(e.key==='Escape'&&isFS())exitFS();
});
let tx=0;
$('stage').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
$('stage').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)go(d<0?1:-1)});
$('nw').onclick=()=>{if(isFS())exitFS();history.replaceState(null,'',location.pathname);V.classList.remove('on');$('home').style.display='block'};

async function pack(o){
  const s=new Blob([JSON.stringify(o)]).stream().pipeThrough(new CompressionStream('gzip'));
  const u=new Uint8Array(await new Response(s).arrayBuffer());let b='';u.forEach(x=>b+=String.fromCharCode(x));
  return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function unpack(t){
  const b=atob(t.replace(/-/g,'+').replace(/_/g,'/'));const u=Uint8Array.from(b,c=>c.charCodeAt(0));
  const s=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(s).text());
}
$('sh').onclick=async()=>{
  $('lnk').value=location.origin+location.pathname+'#d='+await pack(deck);
  $('modal').classList.add('on');
};
$('cp').onclick=async()=>{
  try{await navigator.clipboard.writeText($('lnk').value)}catch(e){$('lnk').select();document.execCommand('copy')}
  $('cp').textContent='Copiado ✓';setTimeout(()=>$('cp').textContent='Copiar link',1800);
};
$('cl').onclick=()=>$('modal').classList.remove('on');

async function d64(u){
  try{const b=await (await fetch(u)).blob();
    return await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.replace(/^data:/,''));f.readAsDataURL(b)})}catch(e){return ''}
}
$('dl').onclick=async()=>{
  const b=$('dl');b.disabled=true;b.textContent='Gerando...';
  try{
    const t=deck.th,c=h=>h.replace('#','');
    const p=new PptxGenJS();p.layout='LAYOUT_WIDE';
    for(const s of deck.s){
      const sl=p.addSlide();sl.background={color:c(t.b1)};
      const img=s.i?await d64(s.i):'';
      const full=s.l!=='split';
      if(img&&full){sl.addImage({data:img,x:0,y:0,w:13.33,h:7.5,sizing:{type:'cover',w:13.33,h:7.5}});
        sl.addShape(p.ShapeType.rect,{x:0,y:0,w:13.33,h:7.5,fill:{color:c(t.b1),transparency:22},line:{color:c(t.b1),transparency:100}})}
      if(img&&!full)sl.addImage({data:img,x:7.4,y:1.2,w:5.2,h:5.1,sizing:{type:'cover',w:5.2,h:5.1}});
      if(s.l==='cover'){
        sl.addText(s.t,{x:.8,y:2.2,w:11,h:1.8,fontSize:46,bold:true,color:c(t.ac),fontFace:t.fh});
        sl.addText(s.u,{x:.8,y:4.1,w:9,h:1,fontSize:22,color:c(t.tx),fontFace:t.fb});
      }else{
        sl.addText(s.t,{x:.7,y:.5,w:12,h:1.1,fontSize:34,bold:true,color:c(t.ac),fontFace:t.fh});
        sl.addShape(p.ShapeType.rect,{x:.7,y:1.6,w:1.6,h:.06,fill:{color:c(t.ac)},line:{color:c(t.ac)}});
        sl.addText(s.b.map(x=>({text:x,options:{bullet:true,breakLine:true,paraSpaceAfter:12}})),
          {x:.7,y:1.9,w:full?11.9:6.4,h:4.9,fontSize:full?22:20,color:c(t.tx),fontFace:t.fb,valign:'top'});
      }
      if(s.n)sl.addNotes(s.n);
    }
    await p.writeFile({fileName:(deck.t||'Slider').replace(/[^\w\- ]/g,'').slice(0,40)+'.pptx'});
  }catch(e){alert('Erro ao gerar PowerPoint: '+e.message)}
  b.disabled=false;b.textContent='⬇ PowerPoint';
};

(async()=>{
  const m=location.hash.match(/^#d=(.+)/);
  if(m){try{deck=await unpack(m[1]);cur=0;show()}catch(e){}}
})();
</script>
